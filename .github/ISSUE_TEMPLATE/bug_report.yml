name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private endpoints, task contents, or instance IDs.
        Report security issues privately instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal synthetic task, configuration excerpt, or code snippet, plus the full error message.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Flotilla version or commit
      placeholder: python -c "import flotilla; print(flotilla.__version__)"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: OpenSandbox execd protocol
      options: [current, legacy, not applicable]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, Harbor version if used, Docker/BuildKit version, OpenSandbox server version.
