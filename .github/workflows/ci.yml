name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 快车道：每次推送 / PR 必须绿。全程不碰真实平台。
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs 需要完整历史取版本
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync
        run: uv sync --all-groups --frozen
      - name: Ruff lint (含 core 时间注入的 banned-api)
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy (strict)
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest

  # 契约道：需要真实部署，手动触发，不挡快车道（Architecture 第 14 节）。
  contract:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "契约测试需连真实部署，此处为占位；见 docs/Architecture.md 第 14 节。"
